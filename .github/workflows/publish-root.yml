name: Publish root build
# Keeps index.html + assets/ in the repo root in sync with main so GitHub Pages
# works with "Deploy from a branch" (main / root). Pushes made with GITHUB_TOKEN do not re-trigger workflows.
on:
  push:
    branches: [main]
    paths-ignore: ['index.html', 'assets/**', '.nojekyll']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:root
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets .nojekyll
          if git diff --cached --quiet; then
            echo "Root build already up to date"
          else
            git commit -m "chore: update root build for GitHub Pages [skip ci]"
            git push
          fi
